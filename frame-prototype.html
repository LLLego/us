<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>us. — photobooth frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&family=Space+Mono:wght@400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --cream:#F2EBE0;
    --cream-deep:#E5DACA;
    --cream-shadow:#D4C5AD;
    --ink:#181410;
    --ink-soft:#3A2F25;
    --red:#D64045;
    --red-dark:#B62F35;
  }

  html,body{min-height:100vh;background:var(--cream)}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    padding:56px 24px 64px;
    position:relative;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #FBF5EA 0%, transparent 60%),
      radial-gradient(ellipse 100% 80% at 30% 110%, #E8DDC8 0%, transparent 60%),
      var(--cream);
  }

  /* page texture */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0 0.05 0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    max-width:520px;margin:0 auto;
  }

  /* ─── eyebrow line ─── */
  .eyebrow{
    width:400px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:0.28em;text-transform:uppercase;color:var(--ink-soft);
    margin-bottom:22px;opacity:.85;
  }
  .eyebrow .dot{color:var(--red);margin:0 2px}

  /* ─── POLAROID ─── */
  .polaroid{
    width:400px;height:500px;position:relative;
    filter:
      drop-shadow(0 1px 1px rgba(24,20,16,0.05))
      drop-shadow(0 12px 24px rgba(24,20,16,0.10))
      drop-shadow(0 36px 60px rgba(24,20,16,0.10));
  }

  /* paper */
  .paper{
    position:absolute;inset:0;
    background:
      linear-gradient(165deg,
        #FBF4E5 0%,
        #F5EDDD 24%,
        #EFE5D0 56%,
        #E7DBBE 86%,
        #DDCBA6 100%);
  }
  .paper::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    mix-blend-mode:screen;opacity:.55;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
  }
  .paper::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 120% 80% at 20% 18%, rgba(255,248,228,0.5), transparent 55%),
      radial-gradient(ellipse 100% 60% at 90% 92%, rgba(160,135,95,0.18), transparent 50%),
      linear-gradient(180deg, rgba(255,250,235,0.12), transparent 14%);
  }

  /* photo window — the bit that would be transparent on a real overlay */
  .photo{
    position:absolute;top:24px;left:24px;right:24px;bottom:136px;
    overflow:hidden;
    background:
      linear-gradient(135deg,
        #E89B7B 0%,
        #D26857 26%,
        #B23F44 50%,
        #7C2A3F 76%,
        #3F1322 100%);
    box-shadow:
      inset 0 0 0 1px rgba(24,20,16,0.04);
  }
  /* sun + figures inside the placeholder */
  .photo::before{
    content:"";position:absolute;
    width:130px;height:130px;border-radius:50%;
    top:24%;left:32%;
    background:radial-gradient(circle at 38% 36%, #FFE9B8, #FFA66B 58%, transparent 78%);
    filter:blur(3px);
  }
  .photo::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:36%;
    background:
      radial-gradient(ellipse 60% 100% at 30% 50%, rgba(20,8,15,0.78), transparent 60%),
      radial-gradient(ellipse 65% 100% at 72% 50%, rgba(20,8,15,0.78), transparent 60%);
  }

  /* inner shadow where the photo meets the paper */
  .photo-mask{
    position:absolute;top:24px;left:24px;right:24px;bottom:136px;
    pointer-events:none;z-index:5;
    box-shadow:
      inset 0 0 0 1px rgba(24,20,16,0.05),
      inset 0 1.5px 2px rgba(24,20,16,0.45),
      inset 0 0 14px rgba(50,28,12,0.28),
      inset 0 0 38px rgba(40,22,10,0.16);
  }

  /* bottom strip content */
  .caption{position:absolute;left:0;right:0;bottom:0;height:136px;z-index:6}

  .date{
    position:absolute;
    top:32px;left:34px;
    font-family:'Caveat',cursive;
    font-size:26px;font-weight:500;
    color:var(--ink);
    transform:rotate(-3.5deg);
    transform-origin:bottom left;
    letter-spacing:0.005em;
    text-shadow:0 0.4px 0 rgba(24,20,16,0.18);
    white-space:nowrap;
  }

  /* brand mark, lower right */
  .brand{
    position:absolute;
    bottom:24px;right:32px;
    font-family:'Fraunces',serif;font-weight:500;
    font-size:15px;letter-spacing:-0.005em;
    color:var(--ink);
    display:flex;align-items:center;gap:3px;
  }
  .brand .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--red);
    margin:0 4px 3px 3px;
    box-shadow:0 0 0 0.5px rgba(214,64,69,0.25);
  }

  /* faint corner crops inside the photo — like film registration marks */
  .corner{
    position:absolute;width:9px;height:9px;z-index:7;
    border:1px solid rgba(255,240,215,0.55);
  }
  .corner.tl{top:30px;left:30px;border-right:none;border-bottom:none}
  .corner.tr{top:30px;right:30px;border-left:none;border-bottom:none}
  .corner.bl{bottom:142px;left:30px;border-right:none;border-top:none}
  .corner.br{bottom:142px;right:30px;border-left:none;border-top:none}

  /* ─── footer line ─── */
  .footer{
    width:400px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-soft);
    margin-top:28px;opacity:.7;
  }
  .footer em{
    font-family:'Fraunces',serif;font-style:italic;font-weight:400;
    font-size:13px;text-transform:none;letter-spacing:0;
    color:var(--ink);opacity:.9;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }

  @media (max-width:460px){
    body{padding:32px 18px 48px}
    .polaroid,.eyebrow,.footer{
      width:320px;height:auto;
      transform:scale(1);transform-origin:top center;
    }
    .polaroid{height:400px}
    .eyebrow,.footer{width:320px}
  }
</style>
</head>
<body>
  <main class="stage">

    <div class="eyebrow">
      <span>us.<span class="dot">·</span>studio</span>
      <span>No. 047 — prototype</span>
    </div>

    <figure class="polaroid" aria-label="Polaroid frame preview">
      <div class="paper"></div>

      <div class="photo" role="img" aria-label="Photo placeholder — warm sunset gradient"></div>

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="photo-mask"></div>

      <figcaption class="caption">
        <span class="date">august 12 '24</span>
        <span class="brand">us<span class="dot"></span></span>
      </figcaption>
    </figure>

    <div class="footer">
      <span>frame · 01 / v3</span>
      <em>for the long way home.</em>
    </div>

  </main>
</body>
</html>
