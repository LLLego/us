<!doctype html>
<html><head><meta charset="utf-8"><title>us.</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:#E9E4DC;padding:24px}
.frame{position:relative;width:900px;height:2700px;border-radius:14px;overflow:hidden;
background:linear-gradient(180deg,#FDEFD3 0%, #FBF3E3 55%, #F7EAD0 100%);
  box-shadow:0 30px 60px -20px rgba(60,45,30,.3)}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>")}
.head{position:absolute;top:0;left:0;right:0;height:280px}
.foot{position:absolute;bottom:0;left:0;right:0;height:110px}
.slot{position:absolute;background:#fff;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.fl{position:absolute;pointer-events:none}

</style></head><body>
<div class="frame">
  <div class="head"><div style="padding:18px 54px 0">
      <div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:58px;color:#6B4E2E;line-height:1">us<span style="color:#D9822B">.</span></div>
      <div style="font-family:'Space Mono',monospace;font-size:12px;color:#9a7b4f;letter-spacing:3px;margin-top:6px">SWEET MOMENTS</div></div></div>
  <div class="slot " style="left:42px;top:280px;width:816px;height:560px"><img src="https://picsum.photos/seed/uspooh0/900/700" alt=""></div>
  <div class="slot " style="left:42px;top:864px;width:816px;height:560px"><img src="https://picsum.photos/seed/uspooh1/900/700" alt=""></div>
  <div class="slot " style="left:42px;top:1447px;width:816px;height:560px"><img src="https://picsum.photos/seed/uspooh2/900/700" alt=""></div>
  <div class="slot " style="left:42px;top:2030px;width:816px;height:560px"><img src="https://picsum.photos/seed/uspooh3/900/700" alt=""></div>
  
  <img class="char" src="../assets/characters/pooh/pooh-wave.png" style="position:absolute;right:26px;top:20px;width:165px;z-index:6;
    filter:drop-shadow(0 16px 22px rgba(120,85,20,.35))" alt="">
  <div style="position:absolute;top:140px;right:210px;background:#fff;border:4px solid #6B4E2E;border-radius:18px;
    8px 16px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;color:#6B4E2E;
    transform:rotate(-2deg);white-space:nowrap;z-index:7">oh bother, take one with me!</div>
  <div class="foot"><div style="display:flex;justify-content:space-between;align-items:center;height:100%;
      padding:0 54px">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="display:flex;gap:6px"><svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 2 L61 38 L98 38 L68 60 L78 96 L50 74 L22 96 L32 60 L2 38 L39 38 Z" fill="#F2B33D"/></svg><svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 2 L61 38 L98 38 L68 60 L78 96 L50 74 L22 96 L32 60 L2 38 L39 38 Z" fill="#F2B33D"/></svg><svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 2 L61 38 L98 38 L68 60 L78 96 L50 74 L22 96 L32 60 L2 38 L39 38 Z" fill="#F2B33D"/></svg><svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 2 L61 38 L98 38 L68 60 L78 96 L50 74 L22 96 L32 60 L2 38 L39 38 Z" fill="#F2B33D"/></svg><svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 2 L61 38 L98 38 L68 60 L78 96 L50 74 L22 96 L32 60 L2 38 L39 38 Z" fill="#F2B33D"/></svg></div>
        <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;color:#6B4E2E">starring: us (+1 bear)</div>
      </div>
      <div class="datetxt" style="background:#6B4E2E;color:#fff;font-family:'Space Mono',monospace;font-size:12px;
        padding:8px 18px;border-radius:999px;letter-spacing:2px">2026.08.16</div>
    </div></div>
</div>

<script>
(function(){
  const F = window.__FRAME__ || {};
  if (F.date) document.querySelectorAll('.datetxt').forEach(el => el.textContent = F.date);
  if (F.photos) document.querySelectorAll('.slot img').forEach((im, i) => {
    if (F.photos[i]) im.src = F.photos[i];
    else if (F.photos.length) im.src = F.photos[F.photos.length - 1];
  });
  document.fonts && document.fonts.ready.then(() => { document.body.setAttribute('data-fr-ready','1'); });
})();
</script>
</body></html>
