.fade.tr{--cx:100%;--cy:0%}.fade.tl{--cx:0%;--cy:0%}.fade.br{--cx:0%;--cy:100%}.fade.bl{--cx:100%;--cy:100%}

<script>
(function(){
  const F = window.__FRAME__ || {};
  if (F.date) document.querySelectorAll('.datetxt').forEach(el => el.textContent = F.date);
  if (F.photos) document.querySelectorAll('.slot img').forEach((im, i) => {
    if (F.photos[i]) im.src = F.photos[i];
    else if (F.photos.length) im.src = F.photos[F.photos.length - 1];
  });
  document.fonts && document.fonts.ready.then(() => { document.body.setAttribute('data-fr-ready','1'); });
